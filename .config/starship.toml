# -*- mode: ini -*-
add_newline = false
format = """
${env_var.VIRTUAL_ENV}\
$hostname\
$directory\
$git_branch\
$git_status\
$character"""

[hostname]
ssh_only = true
ssh_symbol = "󰌘 "
format = "[$ssh_symbol]($style)"
style = "bright-green bold"

[directory]
truncation_length = -1
truncate_to_repo = false
format = "[($home_symbol)($path)]($style)"
style = "blue bold"

[git_branch]
format = "[( \\[$branch\\])]($style)"
style = "bright-yellow bold"

[git_status]
format = "([\\[$all_status\\]]($style))"

[env_var.VIRTUAL_ENV]
format = "[venv ]($style)"
style = "cyan bold"

