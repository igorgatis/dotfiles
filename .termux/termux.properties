# Termux properties
# https://wiki.termux.com/wiki/Terminal_Settings
# https://github.com/termux/termux-tools/blob/master/termux.properties
# https://wiki.termux.com/wiki/Touch_Keyboard#Extra_Keys_Row(s)
#
# Apply changes: termux-reload-settings

### Appearance
# use-black-ui=true
# fullscreen=true
# use-fullscreen-workaround=true
# terminal-margin-horizontal=3
# terminal-margin-vertical=0

### Cursor
# terminal-cursor-style=bar
# terminal-cursor-blink-rate=500

### Scrollback buffer (default ~2000, max 50000)
# terminal-transcript-rows=10000

### Input
# back-key=escape
# bell-character=ignore
# volume-keys=volume
# enforce-char-based-input=true
# ctrl-space-workaround=true

### Hardware keyboard shortcuts
# shortcut.create-session=ctrl + t
# shortcut.next-session=ctrl + 2
# shortcut.previous-session=ctrl + 1
# shortcut.rename-session=ctrl + n

### Extra keys row above the keyboard
extra-keys=[['ESC','/','-','HOME','UP','END','SCROLL'],['TAB','CTRL','ALT','LEFT','DOWN','RIGHT']]
